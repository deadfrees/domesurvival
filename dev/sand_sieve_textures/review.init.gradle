gradle.projectsLoaded {
    gradle.rootProject.afterEvaluate { p ->
        def probe = p.sourceSets.create('sieveTextureProbe') {
            java.srcDir 'dev/sand_sieve_textures/runtime_probe'
            compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
            runtimeClasspath += p.sourceSets.main.runtimeClasspath
        }
        p.minecraft.runs.client.mods.domesurvival.source(probe)
        p.minecraft.runs.client.property 'dome.sieveTextureReview', 'true'
        p.tasks.matching { it.name == 'runClient' }.configureEach { dependsOn p.tasks.named('sieveTextureProbeClasses') }
    }
}
gradle.projectsEvaluated {
    gradle.rootProject.minecraft.runs.client {
        workingDirectory gradle.rootProject.file('run/sand-sieve-texture-review')
        args '--username', 'SieveTextureReview', '--width', '1440', '--height', '900'
    }
}
