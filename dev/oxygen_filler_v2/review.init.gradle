gradle.projectsLoaded {
    gradle.rootProject.afterEvaluate { p ->
        def probe = p.sourceSets.create('oxygenFillerProbe') {
            java.srcDir 'dev/oxygen_filler_v2/runtime_probe'
            compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
            runtimeClasspath += p.sourceSets.main.runtimeClasspath
        }
        p.minecraft.runs.client.mods.domesurvival.source(probe)
        p.minecraft.runs.client.property 'dome.oxygenFillerReview', 'true'
        p.tasks.matching { it.name == 'runClient' }.configureEach { dependsOn p.tasks.named('oxygenFillerProbeClasses') }
    }
}
gradle.projectsEvaluated {
    gradle.rootProject.minecraft.runs.client {
        workingDirectory gradle.rootProject.file('run/oxygen-filler-review')
        args '--username', 'OxygenFillerReview', '--width', '1440', '--height', '900'
    }
}
