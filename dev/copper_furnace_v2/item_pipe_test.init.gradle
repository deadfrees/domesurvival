gradle.projectsLoaded {
    gradle.rootProject.afterEvaluate { p ->
        def probe = p.sourceSets.create('copperFurnaceProbe') {
            java.srcDir 'dev/copper_furnace_v2/runtime_probe'
            compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
            runtimeClasspath += p.sourceSets.main.runtimeClasspath
        }
        p.minecraft.runs.client.mods.domesurvival.source(probe)
        p.minecraft.runs.client.property 'dome.copperFurnaceReview', 'true'
        p.tasks.matching { it.name == 'runClient' }.configureEach { dependsOn p.tasks.named('copperFurnaceProbeClasses') }
    }
}
gradle.projectsEvaluated {
    gradle.rootProject.minecraft.runs.client {
        workingDirectory gradle.rootProject.file('run/copper-furnace-review')
        args '--username', 'ItemPipeReview', '--width', '1440', '--height', '900'
    }
}
