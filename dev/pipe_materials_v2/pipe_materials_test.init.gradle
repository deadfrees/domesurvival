// Disposable fluid-only fixture; this source set is never packaged in the mod.
gradle.projectsLoaded {
    gradle.rootProject.afterEvaluate { p ->
        def probe = p.sourceSets.create('pipeMaterialProbe') {
            java.srcDir 'dev/pipe_materials_v2/runtime_probe'
            compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
            runtimeClasspath += p.sourceSets.main.runtimeClasspath
        }
        p.minecraft.runs.client.mods.domesurvival.source(probe)
        p.minecraft.runs.client.property 'dome.pipeMaterialsV2', 'true'
        p.tasks.matching { it.name == 'runClient' }.configureEach { dependsOn p.tasks.named('pipeMaterialProbeClasses') }
    }
}
gradle.projectsEvaluated {
    gradle.rootProject.minecraft.runs.client {
        workingDirectory gradle.rootProject.file('run/pipe-materials-v2')
        args '--username', 'PipeMaterialV2', '--width', '1280', '--height', '800'
    }
}
