# .codex/config.toml
# Cost-efficient project-scoped Codex configuration for DomeSurvival.

# Main coordinator / primary developer
model = "gpt-6-sol"
model_reasoning_effort = "medium"

[agents]
enabled = true

# Economy mode:
# Keep only one specialist subagent active at a time by default.
max_concurrent_threads_per_session = 1

# Fallback agent behavior if a custom role was not explicitly selected.
default_subagent_model = "gpt-6-sol"
default_subagent_reasoning_effort = "low"

# Avoid extra coordination chatter unless needed.
interrupt_message = false
